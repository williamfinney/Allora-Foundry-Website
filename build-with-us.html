<main id="main">

  <section class="contact-layout">
    <div class="contact-intro">
      <h1>Build with us</h1>
    </div>

    <form class="contact-form" id="build-form">
      <input type="checkbox" name="botcheck" class="honeypot" tabindex="-1" aria-hidden="true">

      <div class="form-row form-row-third">
        <label for="name">Name *</label>
        <input type="text" id="name" name="Name" required>
      </div>
      <div class="form-row form-row-third">
        <label for="email">Email *</label>
        <input type="email" id="email" name="Email" required>
      </div>
      <div class="form-row form-row-third">
        <label for="company">Company / project name</label>
        <input type="text" id="company" name="Company">
      </div>
      <div class="form-row form-row-half">
        <label for="website">Website (if you have one)</label>
        <input type="url" id="website" name="Website" placeholder="https://">
      </div>
      <div class="form-row form-row-half">
        <label for="linkedin">LinkedIn</label>
        <input type="url" id="linkedin" name="LinkedIn" placeholder="https://linkedin.com/in/...">
      </div>
      <div class="form-row form-row-wide">
        <label for="message">What are you building?</label>
        <textarea id="message" name="Message" rows="5"></textarea>
      </div>
      <fieldset class="form-row form-row-wide">
        <legend>What do you need help with?</legend>
        <div class="checkbox-group">
          <label class="checkbox-option"><input type="checkbox" name="Help needed" value="Apple App Development"> Apple App Development</label>
          <label class="checkbox-option"><input type="checkbox" name="Help needed" value="Web & Product Development"> Web &amp; Product Development</label>
          <label class="checkbox-option"><input type="checkbox" name="Help needed" value="Backend & Systems Engineering"> Backend &amp; Systems Engineering</label>
          <label class="checkbox-option"><input type="checkbox" name="Help needed" value="Sales & Marketing Strategy"> Sales &amp; Marketing Strategy</label>
          <label class="checkbox-option"><input type="checkbox" name="Help needed" value="Not sure yet"> Not sure yet</label>
        </div>
      </fieldset>
      <div class="form-actions form-row-wide">
        <button type="submit" class="btn btn-primary">Send</button>
        <p id="build-form-status" class="form-status" role="status"></p>
      </div>
    </form>
  </section>

</main>
