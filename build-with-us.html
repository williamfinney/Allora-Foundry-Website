<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build With Us — Allora Foundry</title>
<meta name="description" content="Tell us what you're building. Allora Foundry partners with founders on apps, websites, and go-to-market — from idea to launch and beyond.">
<link rel="icon" href="assets/allora_foundry_logo_v10.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg-diamonds" aria-hidden="true">
  <span class="bg-diamond bd1"></span>
  <span class="bg-diamond bd2"></span>
  <span class="bg-diamond bd3"></span>
  <span class="bg-diamond bd4"></span>
  <span class="bg-diamond bd5"></span>
  <span class="bg-diamond bd6"></span>
</div>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo-link">
      <img src="assets/allora_foundry_logo_v10.svg" alt="Allora Foundry" class="logo-img">
    </a>
    <nav class="main-nav" id="main-nav">
      <a href="build-with-us.html" class="nav-cta">Build With Us</a>
    </nav>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>

  <section class="section contact-section">
    <div class="container contact-inner">
      <p class="section-label">Build With Us</p>
      <h2>Let's build something</h2>
      <p class="section-intro">Tell us what you're building, or schedule a call.</p>

      <div class="mode-toggle">
        <button type="button" class="mode-toggle-btn active" data-target="form-panel">Fill out the form</button>
        <button type="button" class="mode-toggle-btn" data-target="calendar-panel">Schedule a Call</button>
      </div>

      <div id="form-panel" class="toggle-panel active">
        <form class="contact-form" id="build-form">
          <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

          <div class="form-row">
            <label for="name">Name *</label>
            <input type="text" id="name" name="Name" required>
          </div>
          <div class="form-row">
            <label for="email">Email *</label>
            <input type="email" id="email" name="Email" required>
          </div>
          <div class="form-row">
            <label for="company">Company / project name</label>
            <input type="text" id="company" name="Company">
          </div>
          <div class="form-row">
            <label for="website">Website (if you have one)</label>
            <input type="url" id="website" name="Website" placeholder="https://">
          </div>
          <div class="form-row">
            <label for="linkedin">LinkedIn</label>
            <input type="url" id="linkedin" name="LinkedIn" placeholder="https://linkedin.com/in/...">
          </div>
          <div class="form-row">
            <label for="message">What are you building?</label>
            <textarea id="message" name="Message" rows="5"></textarea>
          </div>
          <div class="form-row">
            <label>What do you need help with?</label>
            <div class="checkbox-group">
              <label class="checkbox-option"><input type="checkbox" name="Help needed" value="Apple App Development"> Apple App Development</label>
              <label class="checkbox-option"><input type="checkbox" name="Help needed" value="Web & Product Development"> Web &amp; Product Development</label>
              <label class="checkbox-option"><input type="checkbox" name="Help needed" value="Backend & Systems Engineering"> Backend &amp; Systems Engineering</label>
              <label class="checkbox-option"><input type="checkbox" name="Help needed" value="Sales & Marketing Strategy"> Sales &amp; Marketing Strategy</label>
              <label class="checkbox-option"><input type="checkbox" name="Help needed" value="Not sure yet"> Not sure yet</label>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Send</button>
          <p id="build-form-status" class="form-status" role="status"></p>
        </form>
      </div>

      <div id="calendar-panel" class="toggle-panel">
        <div class="calendar-embed">
          <iframe
            src="https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ3fWqTdItwV_EjRoT_-j1JhcyKQcNwW4LcWeOkaelR6mCwllKSeZT33U2Iv1v7euCWTfDv_8O6m"
            style="border: 0"
            width="100%"
            height="500"
            frameborder="0">
          </iframe>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-left">
      <a href="mailto:info@allorafoundry.com" class="footer-email">info@allorafoundry.com</a>
      <div class="footer-brand">
        <img src="assets/allora_foundry_logo_v10.svg" alt="Allora Foundry" class="footer-logo">
        <a href="https://www.linkedin.com/company/allorafoundry/" target="_blank" rel="noopener" aria-label="Allora Foundry on LinkedIn" class="footer-linkedin">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        </a>
      </div>
    </div>
    <div class="footer-right">
      <a href="privacy.html">Legal</a>
      <p>&copy; <span id="year"></span> Allora Foundry LLC. All rights reserved.</p>
    </div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
